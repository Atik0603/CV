services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: cvadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cvdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cvadmin:${POSTGRES_PASSWORD}@db:5432/cvdb
    depends_on:
      - db
    volumes:
      - ./backend:/app
    env_file:
      - .env
  
  
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: